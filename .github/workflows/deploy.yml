name: Build and Deploy Recipes backend

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with gradle
        run: ./gradlew build -x test

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "build/libs/*.jar"
          target: "/home/${{ secrets.VPS_USER }}/recipes/back"
          strip_components: 2
          overwrite: true
          rm: true

      - name: Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/recipes/back
            # Находим свежий jar и переименовываем его в backend.jar
            mv *.jar backend.jar
            
            # Перезапускаем только контейнер бэкенда через docker-compose
            # (предполагается, что docker-compose.yml лежит в /home/.../myproject)
            cd ..
            docker-compose restart backend
            
            docker system prune -f
